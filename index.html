<!DOCTYPE html>
<html>

<head>
    <title>SmartDocs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 520px;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: gray;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 48%;
            padding: 8px;
            margin-right: 2%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .info {
            font-size: 12px;
            color: gray;
            margin-top: 5px;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
        }

        .files-list {
            font-size: 13px;
            margin-top: 10px;
        }

        .campo {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 5px;
        }

        .campo input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            margin-bottom: 10px;
            box-sizing: border-box;

        }

        .campo input[readonly] {
            background-color: #eef2ff;
            color: #4338ca;
            font-weight: bold;
        }

        .add-btn {
            background-color: #10b981;
        }

        .add-btn:hover {
            background-color: #0f9f6e;
        }
        .drop-area {
            border: 2px dashed #2563eb;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background-color: #f9fbff;
            transition: 0.3s
        }
        .drop-area:hover {
            background-color: #eef4ff;
        }
        .drop-area.dragover {
            background-color: #dbeafe;
        } 

        .loader {
    border: 4px solid #e5e7eb;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    animation: spin 1s linear infinite;
    margin: 15px auto;
    display: none;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

        .input-error {
            border: 2px solid #ef4444 !important;
            background-color: #fef2f2;
        }

        .preview-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .preview-box h3 {
            margin-top: 0;
            font-size: 16px;
        }

        .preview-item {
            padding: 6px 0;
            color: #374151;
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        .template-item {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }

        .template-item:hover {
            background: #f3f4f6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>SmartDocs</h1>

    <p class="subtitle">
        Automação simples de documentos Word (.docx)
    </p>

    <form id="form">

    <label>
        <strong>Modo de operação:</strong>
    </label>

    <br><br>

    <select id="modo">
        <option value="template">
            Template {{ }}
        </option>

        <option value="livre">
            Substituição Livre
        </option>
    </select>

    <br><br>

    <label>
        <strong>Escolha o arquivo:</strong>
    </label>

    <br>

    <div id="dropArea" class="drop-area">
        <p>
            📄 Arraste seu documento aqui
        </p>
        <p>
            ou clique para selecionar
        </p>
        <input
            type="file"
            name="arquivo"
            id="arquivoInput"
            hidden
        >
    </div>

    <p class="info">
        Envie um arquivo Word (.docx)
    </p>

    <div class="files-list" id="filesList"></div>
    <div id="contadorCampos" class="info"></div>

    <br>

    <label>
        <strong>Substituições:</strong>
    </label>

    <br>

    <div class="preview-box" id="previewBox">

        <h3>
            📄 Campos encontrados
        </h3>

        <div id="previewCampos"></div>

    </div>

    <div id="campos"></div>

    <button
        type="button"
        class="add-btn"
        onclick="adicionarCampo()"
    >
        + Adicionar substituição
    </button>

    <button type="submit">
        Processar Documento
    </button>

    <button
    type="button"
    onclick="limparFormulario()"
>
    Limpar
</button>

</form>

    <h3>
    📚 Templates Salvos
    </h3>

    <div id="listaTemplates"></div>

    <br>

    <div class="status" id="status"></div>

    <div class="loader" id="loader"></div>

</div>

<script src="/js/config.js?v=3"></script>
<script src="/js/api.js?v=3"></script>
<script src="/js/ui.js?v=2"></script>
<script src="/js/app.js?v=5"></script>

</body>
</html>
